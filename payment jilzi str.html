<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYMENT JILZI STR</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --electric-blue: #00d2ff;
            --dark-bg: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efek Background Merah & Biru Menyala */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            z-index: -2;
        }

        /* Animasi Petir Sederhana */
        .lightning-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            z-index: -1;
            pointer-events: none;
            animation: lightning 5s infinite;
        }

        @keyframes lightning {
            0%, 95%, 98% { opacity: 0; }
            96%, 99% { opacity: 0.1; }
            97% { opacity: 0.3; }
        }

        /* Container Utama */
        .container {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-red);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            position: relative;
        }

        h1 {
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px var(--primary-red);
            border-bottom: 2px solid var(--electric-blue);
            padding-bottom: 10px;
        }

        .info-box {
            background: rgba(255, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid var(--electric-blue);
        }

        .label {
            font-size: 0.8rem;
            color: var(--electric-blue);
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .owner-chat {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.6;
        }

        .owner-chat a {
            color: var(--electric-blue);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed var(--electric-blue);
        }

        .owner-chat a:hover {
            color: white;
            border-bottom: 1px solid white;
        }

    </style>
</head>
<body>

    <div class="lightning-flash"></div>

    <div class="container">
        <h1>PAYMENT JILZI STR</h1>
        
        <div class="info-box">
            <span class="label">NOPE JILZI:</span>
            <span class="value">08132291740</span>
        </div>

        <div class="info-box">
            <span class="label">ATAS NAMA:</span>
            <span class="value">GADA / KOSONG ❌</span>
        </div>

        <div class="owner-chat">
            Apabila ingin meminta QRIS All Payment,<br>
            silahkan chat owner: <a href="https://t.me/maklowmat1">@maklowmat1</a>
        </div>
    </div>

</body>
</html>
